name: Deploy Grounded Dev Portal with Docker Compose

on:
  push:
    branches: [refactor/clean-up]

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/refactor/clean-up'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH into Server and Deploy Grounded Portal
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          timeout: 30s
          envs: NEXT_PUBLIC_API_BASE_URL
          script: |
            set -euo pipefail

            APP_DIR="$HOME/grounded-portal-dev"
            REPO_URL="git@github.com:Grounded-RAG/Grounded-frontend.git"
            BRANCH="refactor/clean-up"
            COMPOSE_FILE="docker-compose.dev.yml"
            CONTAINER="grounded-portal-app-dev"
            APP_PORT="3015"

            mkdir -p "$APP_DIR"

            mkdir -p "$HOME/.ssh"
            touch "$HOME/.ssh/known_hosts"
            grep -q github.com "$HOME/.ssh/known_hosts" || ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Directory exists but is not a git repo. Cleaning before clone..."
              find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              git clone -b "$BRANCH" "$REPO_URL" "$APP_DIR"
            else
              echo "Existing git repo found. Syncing to latest $BRANCH..."
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fd
            fi

            cd "$APP_DIR"

            if [ -z "${NEXT_PUBLIC_API_BASE_URL:-}" ]; then
              echo "Missing GitHub secret: NEXT_PUBLIC_API_BASE_URL" >&2
              echo "Set it to your public backend URL, e.g. http://51.20.18.111:8000" >&2
              exit 1
            fi

            case "$NEXT_PUBLIC_API_BASE_URL" in
              *localhost*|*127.0.0.1*)
                echo "ERROR: NEXT_PUBLIC_API_BASE_URL must not use localhost for remote deploy." >&2
                exit 1
                ;;
            esac

            mkdir -p build/web
            date +%s > build/web/version.json

            # No leading spaces — docker compose will not read indented variable names.
            printf 'NEXT_PUBLIC_API_BASE_URL=%s\nAPI_BASE_URL=%s\n' \
              "$NEXT_PUBLIC_API_BASE_URL" "$NEXT_PUBLIC_API_BASE_URL" > .env

            echo "Wrote .env:"
            cat .env

            chmod +x scripts/validate-production-env.sh scripts/verify-deploy-health.sh
            export NEXT_PUBLIC_API_BASE_URL API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL"
            ./scripts/validate-production-env.sh

            docker --version
            docker compose version

            docker compose -f "$COMPOSE_FILE" down --remove-orphans || true
            docker image prune -f || true
            docker builder prune -f || true

            echo "Building image (no cache so CSS/static assets are fresh)..."
            docker compose --progress=plain -f "$COMPOSE_FILE" build --no-cache

            echo "Starting container..."
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            echo "Waiting for app to listen on port $APP_PORT..."
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:${APP_PORT}/login" >/dev/null; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: App did not become ready on port $APP_PORT" >&2
                docker compose -f "$COMPOSE_FILE" logs --tail=80
                exit 1
              fi
              sleep 2
            done

            ./scripts/verify-deploy-health.sh "http://127.0.0.1:${APP_PORT}" "$CONTAINER"

            docker compose -f "$COMPOSE_FILE" ps
            echo "Deploy finished successfully."
