name: Deploy Grounded Dev Portal with Docker Compose

on:
  push:
    branches: [refactor/clean-up]

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/refactor/clean-up'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare deploy package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package

          rsync -a ./ deploy-package/ \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='out' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='coverage' \
            --exclude='.turbo' \
            --exclude='.cache' \
            --exclude='deploy-package'

          du -sh deploy-package

      - name: Upload code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: 'deploy-package/*'
          target: '/home/ubuntu/grounded-portal-dev'
          strip_components: 1
          overwrite: true

      - name: SSH into Server and Deploy Grounded Portal
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 25m
          timeout: 60s
          envs: NEXT_PUBLIC_API_BASE_URL
          script: |
            set -euo pipefail

            APP_DIR="$HOME/grounded-portal-dev"
            cd "$APP_DIR"

            if [ -z "${NEXT_PUBLIC_API_BASE_URL:-}" ]; then
              echo "Missing or empty required environment variable: NEXT_PUBLIC_API_BASE_URL" >&2
              exit 1
            fi

            echo "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL" > .env

            docker compose -f docker-compose.dev.yml down || true
            docker compose -f docker-compose.dev.yml build --progress=plain
            docker compose -f docker-compose.dev.yml up -d
